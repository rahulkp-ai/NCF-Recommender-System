services:
  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ncf_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ncf_pass}
      POSTGRES_DB: ${POSTGRES_DB:-ncf_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ncf_user} -d ${POSTGRES_DB:-ncf_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Model Server ───────────────────────────────────────────────────────────
  model_server:
    build:
      context: .
      dockerfile: deployment/docker/model_server.Dockerfile
    restart: unless-stopped
    volumes:
      - ./production/artifacts:/app/production/artifacts:ro
      - ./production/recommenders:/app/production/recommenders:ro
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ── Backend (FastAPI) ──────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: deployment/docker/backend.Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ncf_user}:${POSTGRES_PASSWORD:-ncf_pass}@db:5432/${POSTGRES_DB:-ncf_db}
      SECRET_KEY: ${SECRET_KEY:-change-me-super-secret-key-min-32-characters!!}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      MODEL_SERVER_URL: http://model_server:8001
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001,http://web:3000
      APP_ENV: ${APP_ENV:-development}
    volumes:
      - ./production/artifacts:/app/production/artifacts:ro
      - ./production/recommenders:/app/production/recommenders:ro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      model_server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Frontend (Next.js) ────────────────────────────────────────────────────
  web:
    build:
      context: production/frontend
      dockerfile: ../../deployment/docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    restart: unless-stopped
    ports:
      - "3001:3000"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000

  # ── Nginx Gateway ─────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deployment/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - web

volumes:
  pgdata: