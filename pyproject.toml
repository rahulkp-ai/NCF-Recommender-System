[project]
name = "ncf-recommender-system"
version = "0.1.0"
description = "Neural Collaborative Filtering movie recommender — research + production system"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Rahul K P" }]

[project.optional-dependencies]
dev = [
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pytest>=8.2.2",
    "pytest-cov>=5.0.0",
    "pre-commit>=3.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["production/backend", "production/recommenders", "production/serving", "production/frontend", "production/gateway-optional", "research"]
exclude = ["research/notebooks", "thesis", "ieee", "production/artifacts", "research/datasets"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true
exclude = ["research/notebooks", "thesis", "ieee", "production/artifacts", "research/datasets"]

[tool.pytest.ini_options]
testpaths = ["production/tests"]
addopts = "-ra --cov=production/backend --cov=production/recommenders --cov=production/serving --cov-report=term-missing"
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
branch = true
omit = ["*/tests/*", "*/research/*", "*/__init__.py"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
"production/backend/app/main.py" = ["E402"]
"production/serving/app/main.py" = ["E402"]
"production/tests/unit/test_metrics.py" = ["E402"]
