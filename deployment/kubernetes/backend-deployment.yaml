apiVersion: apps/v1
kind: Deployment
metadata:
  name: ncf-backend
  labels:
    app: ncf-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ncf-backend
  template:
    metadata:
      labels:
        app: ncf-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/rahulkp-ai/ncf-recommender-system/backend:latest
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: ncf-backend-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ncf-backend
spec:
  selector:
    app: ncf-backend
  ports:
    - port: 80
      targetPort: 8000
